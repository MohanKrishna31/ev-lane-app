<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>nApps.Futs.Mobile</title>
    <base href="/" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="nApps.Futs.Mobile.styles.css" />
    <link rel="icon" href="data:,">

    <!-- Theme Manager Script -->
    <script>
        window.themeManager = {
            setTheme: function (theme) {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('app-theme', theme);
            },
            getTheme: function () {
                return localStorage.getItem('app-theme') || 'dark'; // Defaults to dark mode
            },
            initTheme: function () {
                const theme = this.getTheme();
                this.setTheme(theme);
            }
        };
        // Run immediately to prevent theme flash on load
        window.themeManager.initTheme();
    </script>
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="js/google-maps.js"></script>
    <script src="js/razorpay-checkout.js"></script>

</body>
</html>
